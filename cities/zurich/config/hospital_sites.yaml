# Where each hospital of the Canton of Zürich's hospital lists stands
# (Zürcher Spitalliste 2023: Akutsomatik, Psychiatrie, Rehabilitation; C-05).
#
# The canton's lists name the hospitals but give no address, so this table ties
# every list entry to a building of the federal building register (GWR) by EGID.
# Each entry says where its address comes from, so it can be checked and updated:
#   city:sl001     the City of Zürich's hospital register (poi_spital_view, poi_id)
#   osm:way/123    an OpenStreetMap element's addr:* tags
# `address` + `town`: build_places.py looks the address up in the GWR (exact street
#   and number, in that municipality) and takes its EGID and position; it fails
#   unless exactly one building has that address.
# `gwr`: the GWR's own spelling of that address, where it differs.
# `osm_point` instead of `address`: the source has a position but no address; the
#   EGID is the cadastral building the OSM element's centre lies in.
# `outside`: the hospital stands in that town, too far from the area to be shown.
# `unresolved`: no open source states where it is; not on the map (SOURCES.md).
# A list entry missing from this table stops the build (python3
# cities/zurich/pipeline/swiss/build_places.py hospitals): add it here first.

